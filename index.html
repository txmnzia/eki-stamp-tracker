<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#0b0e17">
    <meta name="apple-mobile-web-app-title" content="Eki Stamp">
    <title>Eki Stamp Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

    <div id="loading-overlay">
        <div class="loading-spinner"></div>
        <p class="loading-text">Loading stations…</p>
        <p class="loading-sub">First load may take a few seconds</p>
    </div>

    <div id="topbar">
        <div id="search-container">
            <div id="search-wrap">
                <svg id="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" id="stationSearch" aria-label="Search stamp stations by name" placeholder="Search stamp stations…" autocomplete="off"
                       role="combobox" aria-expanded="false" aria-controls="suggestions" aria-autocomplete="list" />
            </div>
            <div id="suggestions" role="listbox" aria-label="Station suggestions"></div>
        </div>

        <div id="controls">
            <button class="btn" id="lang-toggle">EN</button>
            <button class="btn" id="session-toggle" aria-expanded="false" aria-controls="session-panel">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
                <span class="session-label">Session</span>
            </button>
        </div>
    </div>

    <div id="session-panel" class="card hidden" role="region" aria-label="Session management">
        <div id="session-header">
            <div id="session-user-row">
                <div id="session-avatar" aria-hidden="true">?</div>
                <div id="session-username" class="placeholder">Not signed in</div>
            </div>
            <div id="sync-status" class="sync-status" aria-live="polite"></div>
            <div id="session-stats">
                <span id="session-count">0 / 0 collected</span>
                <div id="session-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <div id="session-progress-fill"></div>
                </div>
            </div>
        </div>
        <div id="session-body">
            <!-- Signed-in row (hidden until signed in) -->
            <div id="session-loaded-row" class="hidden">
                <div>
                    <div class="session-loaded-label">Signed in</div>
                    <div id="session-loaded-name"></div>
                </div>
                <button class="btn session-btn" id="session-signout">Sign out</button>
            </div>
            <!-- Sign-in form (shown when signed out). Accounts live on the shared
                 Supabase project; no token or credential ever touches this page. -->
            <form id="session-signin-form" class="field" novalidate>
                <label for="session-email-input">Email</label>
                <input type="email" id="session-email-input" class="input" placeholder="you@example.com" autocomplete="email" inputmode="email" required />
                <small class="hint" id="session-signin-hint">Sign in to sync across devices. Stamps already on this device are merged into your account.</small>
                <div class="session-row">
                    <button type="submit" class="btn btn--primary session-btn" id="session-signin">Email me a sign-in link</button>
                </div>
            </form>
            <!-- Sync now (only when signed in) -->
            <div class="session-row hidden" id="session-save-row">
                <button class="btn btn--primary session-btn" id="session-save">Sync now</button>
            </div>
            <!-- Data ops (always visible) -->
            <div class="session-row">
                <button class="btn session-btn" id="session-export">Export JSON</button>
                <button class="btn session-btn" id="session-import">Import JSON</button>
            </div>
            <!-- Danger zone -->
            <button class="btn btn--danger session-btn" id="session-reset">Reset stamps &amp; rides</button>
            <input type="file" id="session-import-file" accept=".json" style="display:none" aria-label="Import stamps JSON file">
        </div>
        <div id="session-version"></div>
    </div>

    <!-- Ride edit mode: a single discreet button. It both signals that editing is
         active and, on click, saves every change and returns to normal mode (#19). -->
    <button id="ride-edit-close" class="btn btn--pill hidden" aria-label="Close ride editing — your changes are saved">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6 9 17l-5-5"/>
        </svg>
        <span>Close editing</span>
    </button>

    <!-- Ride-edit legend: what the painted segment styles mean, shown only while
         editing so the guidance outlives the opening toast (#6 UX audit). -->
    <div id="ride-edit-legend" class="hidden" aria-hidden="true">
        <span class="rl-item"><span class="rl-swatch rl-ridden"></span>Ridden</span>
        <span class="rl-item"><span class="rl-swatch rl-unridden"></span>Not ridden</span>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <div id="stats-bar" aria-live="polite">
        <strong id="bar-count">0</strong><span id="bar-total"></span> stamps collected<span id="stats-hint"> · tap any station to begin 🔖</span>
    </div>

    <div id="map"></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
